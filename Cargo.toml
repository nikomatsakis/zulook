[package]
name = "zulook"
version = "1.0.1"
edition = "2024"
description = "Read-only Zulip agent mod — fetch conversations by URL"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nikomatsakis/zulook"
homepage = "https://github.com/nikomatsakis/zulook"
keywords = ["agent-mod", "zulip", "mcp", "acp"]
categories = ["command-line-utilities"]

[package.metadata.symposium]
args = ["acp"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
schemars = "1"
anyhow = "1"
toml = "0.8"
sacp = "11.0.0-alpha.1"
sacp-tokio = "11.0.0-alpha.1"
